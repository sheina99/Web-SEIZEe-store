<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk - SEIZE STORE</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="container header-wrap">
            <a href="index.html" class="logo">💎 SEIZE STORE</a>
            <nav>
                <a href="index.html">Beranda</a>
                <a href="produk.html" class="active">Produk</a>
                <a href="tentang.html">Tentang</a>
                <a href="kontak.html">Kontak</a>
            </nav>
            <div class="header-actions">
                <span id="userBadge" class="user-badge hidden"></span>
                <button id="btnAuth" class="btn-icon" onclick="openAuthModal()">🔑 Masuk / Daftar</button>
                <button class="btn-icon" onclick="openCartModal()">🛒 Keranjang (<span id="cartCount">0</span>)</button>
            </div>
        </div>
    </header>

    <div class="container page-content">
        <h2 style="margin-bottom: 15px;">Katalog Produk</h2>
        
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterCategory('semua', this)">Semua</button>
            <button class="filter-btn" onclick="filterCategory('kalung', this)">Kalung</button>
            <button class="filter-btn" onclick="filterCategory('gelang', this)">Gelang</button>
            <button class="filter-btn" onclick="filterCategory('set', this)">One Set</button>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Daftar / Masuk Akun</h3>
                <button class="close-modal" onclick="closeModal('authModal')">✕</button>
            </div>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="authName" placeholder="Masukkan nama Anda" required>
                </div>
                <div class="form-group">
                    <label>Email / No. HP</label>
                    <input type="text" id="authEmail" placeholder="08123456789 atau email@mail.com" required>
                </div>
                <button type="submit" class="btn-submit">Simpan Akun</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="cartModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Keranjang Belanja</h3>
                <button class="close-modal" onclick="closeModal('cartModal')">✕</button>
            </div>
            <div id="cartItemsList"></div>
            
            <div id="checkoutFormSection" style="margin-top: 15px; border-top: 1px solid #e2e8f0; padding-top: 10px;">
                <h4>Total Tagihan: Rp <span id="cartTotal">0</span></h4>
                
                <div class="form-group" style="margin-top: 10px;">
                    <label>Alamat Pengiriman</label>
                    <textarea id="coAddress" rows="2" placeholder="Masukkan alamat pengiriman lengkap..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Metode Pembayaran</label>
                    <select id="coPaymentMethod">
                        <option value="dana">DANA</option>
                        <option value="gopay">GoPay</option>
                        <option value="ovo">OVO</option>
                        <option value="qris">QRIS All Payment</option>
                        <option value="tf">Transfer Bank (BCA/BRI/Mandiri)</option>
                    </select>
                </div>

                <button class="btn-wa" onclick="checkoutOrder()">📲 Bayar & Pesan via WhatsApp</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="productModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalProdTitle">Detail Produk</h3>
                <button class="close-modal" onclick="closeModal('productModal')">✕</button>
            </div>
            <div id="modalProdBody"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 <strong>SEIZE STORE</strong>. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
